<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3eb;
      --ink: #172033;
      --muted: #7a8495;
      --line: #ded7c8;
      --paper: #fffaf0;
      --top: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(560px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 18px 32px;
    }

    header {
      margin: 0 -18px 22px;
      padding: 24px 26px 22px;
      color: #fff;
      background: var(--top);
      border-bottom-right-radius: 24px;
      border-bottom-left-radius: 24px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .paper {
      min-height: 360px;
      padding: 20px;
      background:
        linear-gradient(transparent 31px, rgba(178, 146, 84, .18) 32px),
        var(--paper);
      background-size: 100% 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(23, 32, 51, .08);
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Трекер привычек</h1>
    </header>

    <section class="paper">
      <p class="muted">Mini App очищен. Можно собирать заново с чистого листа.</p>
    </section>
  </main>

  <script>
    window.Telegram?.WebApp?.ready();
    window.Telegram?.WebApp?.expand();
  </script>
</body>
</html>
