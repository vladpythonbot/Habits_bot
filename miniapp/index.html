<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HabitFlow</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #eef1f6;
      --text: #202331;
      --muted: #667084;
      --line: #dde3ed;
      --ink: #202331;
      --mint: #147d64;
      --mint-soft: #e4f3ed;
      --sky: #4059ad;
      --sky-soft: #e8edff;
      --coral: #ba4b54;
      --coral-soft: #fae8e9;
      --sun: #9b6a1d;
      --sun-soft: #fbefd8;
      --danger: #bf3b4a;
      --shadow: 0 12px 28px rgba(28, 38, 64, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 16px 12px 28px;
    }

    header,
    .section-head,
    .item-top,
    .habit-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header { margin-bottom: 12px; }

    h1,
    h2,
    h3,
    p {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 27px;
      line-height: 1.08;
    }

    h2 {
      font-size: 17px;
      line-height: 1.25;
    }

    h3 {
      font-size: 15px;
      line-height: 1.25;
    }

    .muted,
    .date,
    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .pill,
    .chip,
    .delta,
    .status {
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 12px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      background: var(--mint);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--line);
    }

    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--line);
    }

    button.active {
      background: var(--ink);
      color: white;
    }

    .panel,
    .habit-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 14px;
      margin-bottom: 12px;
    }

    .today-card {
      display: grid;
      grid-template-columns: 128px 1fr;
      gap: 16px;
      align-items: center;
      min-height: 170px;
      background: var(--mint-soft);
      border-color: #c8eadb;
    }

    .ring {
      --value: 0deg;
      width: 118px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--mint) var(--value), rgba(255, 255, 255, .72) 0);
      position: relative;
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: var(--surface);
    }

    .ring b {
      position: relative;
      z-index: 1;
      color: var(--mint);
      font-size: 27px;
      line-height: 1;
    }

    .today-copy {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .today-copy strong {
      font-size: 22px;
      line-height: 1.14;
      overflow-wrap: anywhere;
    }

    .today-mini {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .today-list {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .today-habit {
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .mark-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mark-actions button {
      min-height: 38px;
      padding: 0 8px;
    }

    .habit-stat-card {
      padding: 12px;
      display: grid;
      gap: 10px;
      cursor: pointer;
    }

    .habit-progress-head {
      align-items: flex-start;
    }

    .habit-progress-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .habit-progress-title strong,
    .habit-name {
      font-size: 16px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .rate-track {
      width: 100%;
      height: 9px;
      border-radius: 99px;
      background: #dbe8de;
      overflow: hidden;
    }

    .rate-fill {
      height: 100%;
      width: var(--width);
      border-radius: inherit;
      background: var(--mint);
    }

    .form-panel {
      display: grid;
      gap: 10px;
    }

    form,
    .inline-form {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .add-row {
      grid-template-columns: 1fr auto;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 11px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }

    input:disabled {
      color: var(--muted);
      background: var(--surface-soft);
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .habit-card {
      padding: 12px;
    }

    .item-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .status.done {
      color: var(--mint);
      background: var(--mint-soft);
      border-color: #c8eadb;
    }

    .status.open {
      color: var(--sun);
      background: var(--sun-soft);
      border-color: #efd29c;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .settings {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .reminder-row {
      grid-template-columns: 50px 1fr auto;
    }

    .goal-row {
      grid-template-columns: 50px 1fr;
      align-items: center;
    }

    .empty,
    .error {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      background: var(--surface-soft);
    }

    .hidden { display: none; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: end center;
      padding: 16px 12px;
      background: rgba(20, 28, 24, .32);
    }

    .modal.hidden { display: none; }

    .delete-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(20, 28, 24, .22);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions button {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 680px) {
      .today-card { grid-template-columns: 96px 1fr; }
      .ring { width: 92px; }
      .mark-actions { grid-template-columns: 1fr; }
      .reminder-row { grid-template-columns: 44px 1fr; }
      .reminder-row button { grid-column: 1 / -1; }
      .status { white-space: normal; text-align: right; }
    }

    @media (max-width: 420px) {
      main { padding-inline: 10px; }
      .add-row { grid-template-columns: 1fr; }
      .today-card { grid-template-columns: 1fr; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151f;
        --surface: #181f2a;
        --surface-soft: #222b39;
        --text: #f5f3ee;
        --muted: #b3aca3;
        --line: #30394a;
        --ink: #f5f3ee;
        --mint-soft: #14382e;
        --sky-soft: #172b55;
        --coral-soft: #3a2225;
        --sun-soft: #3b2d16;
        --shadow: none;
      }

      .today-card { border-color: #245543; }
      .ring::after { background: var(--surface); }
      .rate-track,
      .week-dot { background: #344053; }
      button.active { color: #11151f; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>HabitFlow</h1>
        <div class="date" id="today">Сегодня</div>
      </div>
      <span class="pill">Today</span>
    </header>

    <nav class="tabs">
      <button class="active" id="today-tab" type="button">Сегодня</button>
      <button class="secondary" id="manage-tab" type="button">Управление</button>
    </nav>

    <section id="today-view">
      <div class="panel today-card">
        <div class="ring" id="ring"><b id="rate">0%</b></div>
        <div class="today-copy">
          <strong id="summary-title">Пока собираем статистику</strong>
          <p class="muted" id="summary-copy">Сегодняшний прогресс появится после отметок.</p>
          <div class="today-mini">
            <span class="chip" id="today-score">0/0 сегодня</span>
            <span class="chip" id="week-score">0% за 7 дней</span>
          </div>
        </div>
      </div>

      <div class="section-head">
        <h2>Отметить сегодня</h2>
        <span class="muted" id="today-left">0 осталось</span>
      </div>
      <div class="today-list" id="today-list"></div>
    </section>

    <section id="manage-view" class="hidden">
      <div class="panel form-panel">
        <h2>Добавить привычку</h2>
        <form class="add-row" id="add-form">
          <input id="habit-name" maxlength="80" placeholder="Например: выпить воду" autocomplete="off">
          <button type="submit">Добавить</button>
        </form>
      </div>

      <div class="section-head">
        <h2>Управление</h2>
        <span class="muted">Привычки и напоминания</span>
      </div>
      <div class="list" id="list">
        <div class="empty">Загрузка...</div>
      </div>
    </section>
  </main>

  <datalist id="reminder-presets">
    <option value="08:00" label="Утро"></option>
    <option value="13:00" label="День"></option>
    <option value="20:00" label="Вечер"></option>
    <option value="09:00, 14:00, 20:00" label="Часто"></option>
  </datalist>

  <div class="modal hidden" id="delete-modal">
    <div class="delete-card">
      <div>
        <h2>Удалить привычку?</h2>
        <p class="muted" id="delete-copy">История отметок тоже исчезнет.</p>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="delete-cancel" type="button">Отмена</button>
        <button class="danger" id="delete-confirm" type="button">Удалить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const initData = tg?.initData || "";
    const state = { data: null, stats: null, tab: "today" };

    const todayTab = document.querySelector("#today-tab");
    const manageTab = document.querySelector("#manage-tab");
    const todayView = document.querySelector("#today-view");
    const manageView = document.querySelector("#manage-view");
    const todayList = document.querySelector("#today-list");
    const list = document.querySelector("#list");
    const form = document.querySelector("#add-form");
    const input = document.querySelector("#habit-name");
    const deleteModal = document.querySelector("#delete-modal");
    const deleteCopy = document.querySelector("#delete-copy");
    const deleteCancel = document.querySelector("#delete-cancel");
    const deleteConfirm = document.querySelector("#delete-confirm");
    let pendingDelete = null;

    async function request(path, payload = {}) {
      const response = await fetch(path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": initData,
        },
        body: JSON.stringify({ _auth: initData, ...payload }),
      });
      if (!response.ok) {
        const message = (await response.text()).trim() || `HTTP ${response.status}`;
        throw new Error(message);
      }
      return response.json();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function authErrorText(error) {
      const raw = String(error?.message || "").trim();
      if (!initData) return "Telegram не передал данные входа. Открой Mini App из кнопки бота.";
      if (raw.includes("expired")) return "Сессия Telegram устарела. Закрой Mini App и открой заново из бота.";
      if (raw.includes("invalid")) return "Telegram-вход не совпал с токеном бота на сервере. Проверь BOT_TOKEN в Railway.";
      if (raw.includes("missing") || raw.includes("required")) return "Telegram не передал данные входа. Открой Mini App из кнопки бота.";
      return `Не удалось проверить вход Telegram: ${escapeHtml(raw || "неизвестная ошибка")}`;
    }

    function setTab(tab) {
      state.tab = tab;
      const today = tab === "today";
      const manage = tab === "manage";
      todayView.classList.toggle("hidden", !today);
      manageView.classList.toggle("hidden", !manage);
      todayTab.classList.toggle("active", today);
      todayTab.classList.toggle("secondary", !today);
      manageTab.classList.toggle("active", manage);
      manageTab.classList.toggle("secondary", !manage);
    }

    function byId(items) {
      return new Map((items || []).map((item) => [Number(item.id), item]));
    }

    function normalizeStats(stats) {
      const dailyDone = stats?.daily_done || {};
      const dates = stats?.dates || Object.keys(dailyDone).sort();
      const habitsCount = Number(stats?.habits_count || 0);
      const todayDone = Number(stats?.today_done || 0);
      const todayPossible = Number(stats?.today_possible || habitsCount);
      const habitRows = (stats?.habit_rows || stats?.habits || []).map((habit) => {
        const percent = Number(habit.completion_rate ?? habit.percent ?? 0);
        const targetDays = Number(habit.possible ?? habit.target_days ?? 0);
        const factDays = Number(habit.period_completed ?? habit.fact_days ?? 0);
        return {
          ...habit,
          completion_rate: percent,
          possible: targetDays,
          period_completed: factDays,
          missed_count: Number(habit.missed_count ?? habit.missed_days ?? 0),
          last_7_completed: Number(habit.last_7_completed ?? factDays),
          last_7_possible: Number(habit.last_7_possible ?? targetDays),
          best_streak: Number(habit.best_streak ?? habit.streak ?? 0),
          calendar: habit.calendar || [],
        };
      });
      const monthPossible = Math.max(1, habitRows.reduce((sum, habit) => sum + Number(habit.possible || 0), 0));
      const monthDone = habitRows.reduce((sum, habit) => sum + Number(habit.period_completed || 0), 0);
      const weekDates = dates.slice(-7);
      const weekDone = weekDates.reduce((sum, date) => sum + Number(dailyDone[date] || 0), 0);
      const weekPossible = Math.max(1, weekDates.length * habitsCount);
      const dailyPossible = stats?.daily_possible || Object.fromEntries(dates.map((date) => [date, habitsCount]));
      const bestHabit = stats?.best_habit || [...habitRows].sort((a, b) => b.completion_rate - a.completion_rate)[0] || null;
      const focusHabit = stats?.focus_habit || [...habitRows].sort((a, b) => a.completion_rate - b.completion_rate)[0] || null;

      return {
        ...stats,
        dates,
        daily_done: dailyDone,
        daily_possible: dailyPossible,
        habit_rows: habitRows,
        today_done: todayDone,
        today_possible: todayPossible,
        today_rate: stats?.today_rate ?? (todayPossible ? Math.round(todayDone / todayPossible * 100) : 0),
        completion_rate: stats?.completion_rate ?? Math.round(monthDone / monthPossible * 100),
        week_rate: stats?.week_rate ?? Math.round(weekDone / weekPossible * 100),
        best_streak: stats?.best_streak ?? Math.max(0, ...habitRows.map((habit) => Number(habit.best_streak || habit.streak || 0))),
        perfect_days: stats?.perfect_days ?? dates.filter((date) => habitsCount > 0 && Number(dailyDone[date] || 0) >= habitsCount).length,
        trend: stats?.trend ?? 0,
        best_habit: bestHabit,
        focus_habit: focusHabit,
        average_streak: stats?.average_streak ?? Math.round(habitRows.reduce((sum, habit) => sum + Number(habit.streak || 0), 0) / Math.max(1, habitRows.length)),
      };
    }

    function goalValue(habit) {
      if (habit.goal_type === "weekly") return `weekly_${habit.goal_value || 3}`;
      return habit.goal_type || "daily";
    }

    function goalPayload(value) {
      if (value.startsWith("weekly_")) {
        return { goal_type: "weekly", goal_value: Number(value.replace("weekly_", "")) || 3 };
      }
      if (value === "weekdays") return { goal_type: "weekdays", goal_value: 5 };
      return { goal_type: "daily", goal_value: 7 };
    }

    function goalOptions(selected) {
      const options = [
        ["daily", "Каждый день"],
        ["weekdays", "По будням"],
        ["weekly_3", "3 раза в неделю"],
        ["weekly_5", "5 раз в неделю"],
      ];
      return options.map(([value, label]) => (
        `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`
      )).join("");
    }

    async function refreshAll() {
      const [data, stats] = await Promise.all([
        request("/api/state"),
        request("/api/stats"),
      ]);
      const normalizedStats = normalizeStats(stats);
      state.data = data;
      state.stats = normalizedStats;
      renderToday(data, normalizedStats);
      renderManage(data);
    }

    function renderToday(data, stats) {
      const habits = data.habits || [];
      const open = habits.filter((habit) => !habit.done_today && !habit.missed_today).length;
      document.querySelector("#today-left").textContent = `${open} осталось`;

      if (!habits.length) {
        todayList.innerHTML = '<div class="empty">Пока нет привычек. Добавь первую во вкладке управления.</div>';
        return;
      }

      const statsMap = byId(stats.habit_rows);
      todayList.innerHTML = habits.map((habit) => {
        const row = statsMap.get(Number(habit.id));
        const rate = row?.completion_rate || 0;
        const status = habit.done_today ? "done" : "open";
        const statusText = habit.done_today ? "готово" : (habit.missed_today ? "не сегодня" : "ждёт отметки");
        return `
          <article class="today-habit panel" data-id="${habit.id}">
            <div class="habit-progress-head">
              <div class="habit-progress-title">
                <strong>${escapeHtml(habit.name)}</strong>
                <span class="muted">${escapeHtml(habit.goal_text)} · серия ${habit.streak} · ${rate}% за 30 дней</span>
              </div>
              <span class="status ${status}">${statusText}</span>
            </div>
            <div class="rate-track"><div class="rate-fill" style="--width:${rate}%"></div></div>
          </article>
        `;
      }).join("");
    }

    function renderManage(data) {
      if (!data.habits.length) {
        list.innerHTML = '<div class="empty">Пока нет активных привычек. Добавь первую здесь, а отмечай в боте.</div>';
      } else {
        list.innerHTML = data.habits.map((habit) => {
        const reminderText = habit.reminder?.enabled ? `Напоминание: ${escapeHtml(habit.reminder.reminder_time)}` : "Напоминание выключено";
        return `
          <article class="habit-card">
            <div class="item-top">
              <div class="item-title">
                <h2 class="habit-name">${escapeHtml(habit.name)}</h2>
                <p class="muted">${escapeHtml(habit.goal_text)} · серия: ${habit.streak} · всего: ${habit.total_completed} · ${reminderText}</p>
              </div>
              <span class="status ${habit.done_today ? "done" : "open"}">${habit.done_today ? "сегодня отмечено" : "ждёт отметки"}</span>
            </div>
            <div class="actions">
              <button class="ghost" data-action="rename" data-id="${habit.id}" data-name="${escapeHtml(habit.name)}">Переименовать</button>
              <button class="danger" data-action="delete" data-id="${habit.id}" data-name="${escapeHtml(habit.name)}">Удалить</button>
            </div>
            <div class="settings">
              <div class="inline-form goal-row">
                <input value="Цель" disabled>
                <select data-action="goal" data-id="${habit.id}">
                  ${goalOptions(goalValue(habit))}
                </select>
              </div>
              <form class="inline-form reminder-row" data-action="reminder-form" data-id="${habit.id}">
                <input value="⏰" disabled>
                <input name="reminder" list="reminder-presets" placeholder="08:00 или 09:00, 21:00" value="${escapeHtml(habit.reminder?.reminder_time || "")}">
                <button type="submit">Сохранить</button>
              </form>
              ${habit.reminder?.enabled ? `<button class="ghost" data-action="reminder-off" data-id="${habit.id}">Отключить напоминание</button>` : ""}
            </div>
          </article>
        `;
        }).join("");
      }
    }

    async function refresh() {
      try {
        await refreshAll();
      } catch (error) {
        const details = authErrorText(error);
        document.querySelector("#rate").textContent = "—";
        document.querySelector("#summary-title").textContent = "Данные не загружены";
        document.querySelector("#summary-copy").textContent = details;
        document.querySelector("#today-score").textContent = "—";
        document.querySelector("#week-score").textContent = "—";
        document.querySelector("#today-left").textContent = "ошибка входа";
        todayList.innerHTML = `<div class="error">${details}</div>`;
        list.innerHTML = `<div class="error">${details}</div>`;
      }
    }

    todayTab.addEventListener("click", () => setTab("today"));
    manageTab.addEventListener("click", () => setTab("manage"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;
      input.value = "";
      state.data = await request("/api/habits", { name });
      state.stats = await request("/api/stats");
      renderToday(state.data, state.stats);
      renderManage(state.data);
    });

    list.addEventListener("submit", async (event) => {
      const reminderForm = event.target.closest('form[data-action="reminder-form"]');
      if (!reminderForm) return;
      event.preventDefault();
      const reminder = reminderForm.elements.reminder.value.trim();
      if (!reminder) return;
      state.data = await request(`/api/habits/${reminderForm.dataset.id}/reminder`, { reminder_time: reminder });
      state.stats = await request("/api/stats");
      renderToday(state.data, state.stats);
      renderManage(state.data);
    });

    list.addEventListener("change", async (event) => {
      const select = event.target.closest('select[data-action="goal"]');
      if (!select) return;
      state.data = await request(`/api/habits/${select.dataset.id}/goal`, goalPayload(select.value));
      state.stats = await request("/api/stats");
      renderToday(state.data, state.stats);
      renderManage(state.data);
    });

    list.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, id, name } = button.dataset;

      if (action === "rename") {
        const nextName = prompt("Новое название привычки:", name);
        if (!nextName || !nextName.trim()) return;
        state.data = await request(`/api/habits/${id}/rename`, { name: nextName.trim() });
      }

      if (action === "reminder-off") {
        state.data = await request(`/api/habits/${id}/reminder/off`);
      }

      if (action === "delete") {
        pendingDelete = { id, name: name || "" };
        deleteCopy.textContent = pendingDelete.name
          ? `«${pendingDelete.name}» и история отметок исчезнут.`
          : "Привычка и история отметок исчезнут.";
        deleteModal.classList.remove("hidden");
        return;
      }

      state.stats = await request("/api/stats");
      renderToday(state.data, state.stats);
      renderManage(state.data);
    });

    function closeDeleteModal() {
      pendingDelete = null;
      deleteModal.classList.add("hidden");
    }

    deleteCancel.addEventListener("click", closeDeleteModal);
    deleteModal.addEventListener("click", (event) => {
      if (event.target === deleteModal) closeDeleteModal();
    });
    deleteConfirm.addEventListener("click", async () => {
      if (!pendingDelete) return;
      const { id } = pendingDelete;
      deleteConfirm.disabled = true;
      try {
        state.data = await request(`/api/habits/${id}/delete`);
        state.stats = await request("/api/stats");
        renderToday(state.data, state.stats);
        renderManage(state.data);
        closeDeleteModal();
      } finally {
        deleteConfirm.disabled = false;
      }
    });

    todayList.addEventListener("click", async (event) => {
      const target = event.target.closest("[data-action]");
      if (!target || !todayList.contains(target)) return;
      const { action, id } = target.dataset;
if (action === "mark") {
        await request(`/api/habits/${id}/mark`);
      }

      if (action === "miss") {
        await request(`/api/habits/${id}/miss`);
      }

      if (action === "undo") {
        await request(`/api/habits/${id}/undo`);
      }

      await refreshAll();
    });

    refresh();
  </script>
</body>
</html>
