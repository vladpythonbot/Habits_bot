<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой блокнот</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --chrome: #14202b;
      --panel: #ffffff;
      --panel-2: #f7f9fd;
      --paper: #fffaf0;
      --line: #dfe6f1;
      --text: #06142c;
      --muted: #8fa0bb;
      --accent: #746fff;
      --accent-2: #8a86ff;
      --blue: #5894ff;
      --yellow: #ffb800;
      --danger: #e55367;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--chrome);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: min(720px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 20px 104px;
      background: var(--bg);
    }
    header, .top, .habit-row, .sleep-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    header {
      margin: 0 -20px 24px;
      padding: 24px 28px;
      background: var(--chrome);
      color: #fff;
    }
    h1, h2, p { margin: 0; letter-spacing: 0; }
    h1 { font-size: 24px; line-height: 1.1; }
    h2 { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .tabs {
      position: fixed;
      left: 50%;
      bottom: 30px;
      z-index: 4;
      width: min(440px, calc(100% - 40px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 34px rgba(15, 29, 50, .13);
      transform: translateX(-50%);
    }
    button, input, select, textarea {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font: inherit;
    }
    button { background: var(--panel-2); color: var(--text); font-weight: 700; cursor: pointer; padding: 0 11px; }
    button.active, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.ghost { background: transparent; color: var(--muted); }
    button.danger { background: transparent; color: var(--danger); }
    button.done { background: rgba(116, 111, 255, .12); border-color: rgba(116, 111, 255, .4); color: var(--accent); }
    button.skipped { background: rgba(247, 201, 72, .12); border-color: rgba(247, 201, 72, .45); color: var(--yellow); }
    button:disabled { cursor: default; opacity: .9; }
    input, select, textarea { width: 100%; min-width: 0; background: var(--panel); color: var(--text); padding: 0 11px; }
    textarea { min-height: 118px; padding: 13px 14px; resize: vertical; line-height: 1.45; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 10px;
      box-shadow: 0 10px 24px rgba(15, 29, 50, .08);
    }
    .hidden { display: none; }
    .list { display: grid; gap: 10px; }
    .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; }
    .summary, .today-card, .habit-card, .primary-card { display: grid; gap: 10px; }
    .summary { background: transparent; border: 0; box-shadow: none; padding: 0; margin-bottom: 10px; }
    .summary p { display: none; }
    .summary h2 { font-size: 30px; }
    .note-card {
      background:
        linear-gradient(transparent 31px, rgba(222, 195, 130, .2) 32px),
        var(--paper);
      background-size: 100% 32px;
      border-color: #f0dfb7;
    }
    .note-card textarea {
      border: 0;
      background: transparent;
      padding-left: 0;
      padding-right: 0;
      outline: none;
    }
    .note-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .note-status { color: #b58a26; font-size: 12px; font-weight: 700; }
    .stats-list { display: grid; gap: 10px; }
    .stat-card { display: grid; gap: 8px; }
    .stat-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .stat-percent { color: var(--accent); font-size: 20px; font-weight: 900; }
    .stat-bar { height: 8px; overflow: hidden; border-radius: 999px; background: #e9eef7; }
    .stat-fill { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .stat-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; color: var(--muted); font-size: 12px; }
    .primary-card {
      min-height: 140px;
      overflow: hidden;
      position: relative;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: 0;
      border-radius: 20px;
      box-shadow: 0 18px 34px rgba(116, 111, 255, .28);
    }
    .primary-card::after {
      content: "☆";
      position: absolute;
      right: -4px;
      top: -22px;
      color: rgba(255, 255, 255, .16);
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
    }
    .badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: transparent;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      font-weight: 800;
    }
    .primary-card .muted { color: rgba(255, 255, 255, .78); }
    .primary-card button.done { background: #fff; border-color: #fff; color: var(--accent); }
    .primary-card button.ghost { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .24); color: #fff; }
    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .habit-card.dragging { opacity: .55; transform: scale(.99); }
    .habit-row { align-items: flex-start; }
    .drag-handle {
      width: 42px;
      min-width: 42px;
      min-height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      touch-action: none;
      cursor: grab;
      user-select: none;
      font-size: 20px;
      line-height: 1;
    }
    .habit-title { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .habit-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .settings { display: grid; gap: 8px; grid-template-columns: 1fr; }
    .add-form, .reminder-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .quick-add {
      width: 100%;
      margin: 0 0 30px;
      border: 1px dashed #d8e1ef;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
    }
    .sleep-panel { background: var(--panel); }
    .sleep-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .sleep-rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; grid-column: 1 / -1; }
    .sleep-rate button.selected { background: var(--yellow); border-color: var(--yellow); color: #1c1602; }
    .sleep-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .sleep-kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .sleep-kpi b { display: block; font-size: 20px; line-height: 1.1; }
    .sleep-chart {
      min-height: 292px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f7f7f4;
    }
    .sleep-chart svg { display: block; width: 100%; height: 292px; }
    .grid-line { stroke: rgba(80, 80, 80, .18); stroke-width: 1; }
    .axis-line { stroke: rgba(50, 50, 50, .45); stroke-width: 1.4; }
    .sleep-bar-svg { fill: rgba(88, 148, 255, .18); }
    .quality-line { fill: none; stroke: #008000; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .quality-dot { fill: #8fd0b0; stroke: #008000; stroke-width: 2.5; }
    .chart-label { fill: #686868; font-size: 14px; font-family: inherit; }
    .chart-title { fill: #686868; font-size: 15px; font-weight: 700; font-family: inherit; }
    .toast { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 10; display: none; place-items: center; }
    .toast span { max-width: 520px; width: 100%; background: #0b0f16; border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; color: var(--text); }
    .toast.show { display: grid; }
    .modal { position: fixed; inset: 0; z-index: 5; display: grid; place-items: end center; padding: 14px 12px; background: rgba(0,0,0,.48); }
    .modal.hidden { display: none; }
    .modal-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 460px) {
      .actions, .habit-actions, .add-form, .reminder-form, .sleep-summary { grid-template-columns: 1fr; }
      .sleep-chart { gap: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Мой блокнот</h1>
        <p class="muted" id="today-label">Сегодня</p>
      </div>
      <p class="muted" id="hello"></p>
    </header>

    <nav class="tabs">
      <button class="active" id="tab-today" type="button">День</button>
      <button id="tab-sleep" type="button">Сон</button>
      <button id="tab-manage" type="button">Список</button>
    </nav>

    <section id="view-today">
      <div class="panel summary">
        <h2 id="summary">Загрузка</h2>
        <p class="muted">Без процентов. Только то, что помогает держать день.</p>
      </div>
      <div id="primary-today"></div>
      <div class="list" id="today-list"></div>
      <button class="quick-add" id="quick-add" type="button">＋ Добавить привычку</button>
      <section class="panel note-card">
        <div class="note-head">
          <h2>Заметка дня</h2>
          <span class="note-status" id="note-status">сохранено</span>
        </div>
        <textarea id="daily-note" maxlength="1200" placeholder="Пара строк для себя: что держать в фокусе, что отпустить, что заметил."></textarea>
      </section>
      <section class="panel">
        <div class="note-head">
          <h2>Как прижились</h2>
          <span class="muted">30 дней</span>
        </div>
        <div class="stats-list" id="habit-stats"></div>
      </section>
    </section>

    <section id="view-sleep" class="hidden">
      <div class="panel sleep-panel">
        <div class="sleep-head">
          <div>
            <h2>Сон</h2>
            <p class="muted">часы и качество за 7 дней</p>
          </div>
        </div>
        <form class="sleep-form" id="sleep-form">
          <input id="sleep-out" type="time" value="23:30" aria-label="Лёг спать">
          <input id="sleep-up" type="time" value="07:30" aria-label="Проснулся">
          <div class="sleep-rate" id="sleep-rate">
            <button type="button" data-rate="1">1</button>
            <button type="button" data-rate="2">2</button>
            <button type="button" data-rate="3">3</button>
            <button type="button" data-rate="4">4</button>
            <button type="button" data-rate="5">5</button>
          </div>
        </form>
        <div class="sleep-summary">
          <div class="sleep-kpi"><b id="sleep-avg">-</b><span class="muted">средний сон</span></div>
          <div class="sleep-kpi"><b id="sleep-quality">-</b><span class="muted">качество</span></div>
        </div>
        <div class="sleep-chart" id="sleep-chart"></div>
      </div>
    </section>

    <section id="view-manage" class="hidden">
      <form class="panel add-form" id="add-form">
        <input id="habit-name" maxlength="80" placeholder="Новая строка в блокноте" autocomplete="off">
        <button class="primary" type="submit">Добавить</button>
      </form>
      <div class="list" id="habit-list"></div>
    </section>
  </main>

  <div class="modal hidden" id="rename-modal">
    <div class="modal-card">
      <h2>Переименовать</h2>
      <input id="rename-input" maxlength="80">
      <div class="modal-actions">
        <button class="ghost" id="rename-cancel" type="button">Отмена</button>
        <button class="primary" id="rename-save" type="button">Сохранить</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><span></span></div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const initData = tg?.initData || "";
    const state = { data: null, sleep: null, tab: "today", rename: null, draggingId: null, refreshing: false };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
    }[char]));

    function showToast(message) {
      const toast = $("#toast");
      toast.querySelector("span").textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    async function request(path, body = {}, method = "POST") {
      const response = await fetch(path, {
        method,
        cache: "no-store",
        headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
        body: body === null ? undefined : JSON.stringify(body),
      });
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    function setTab(tab) {
      state.tab = tab;
      ["today", "sleep", "manage"].forEach((name) => {
        $(`#view-${name}`).classList.toggle("hidden", name !== tab);
        $(`#tab-${name}`).classList.toggle("active", name === tab);
      });
      refresh();
    }

    async function refresh() {
      if (state.refreshing) return;
      state.refreshing = true;
      try {
        const [data, sleep] = await Promise.all([
          request("/api/state", null, "GET"),
          request("/api/sleep/stats", null, "GET"),
        ]);
        state.data = data;
        state.sleep = sleep;
        render();
      } catch {
        $("#summary").textContent = initData ? "Не удалось загрузить данные." : "Открой Mini App из Telegram.";
      } finally {
        state.refreshing = false;
      }
    }

    function render() {
      const data = state.data || { habits: [], summary: {} };
      $("#today-label").textContent = data.today || "Сегодня";
      $("#hello").textContent = data.user?.first_name || "";
      renderToday(data);
      renderNote(data.note || "");
      renderHabitStats(data.habit_stats || []);
      renderManage(data);
      renderSleep(state.sleep?.items || []);
    }

    function renderNote(note) {
      const input = $("#daily-note");
      if (document.activeElement !== input && input.value !== note) input.value = note;
      $("#note-status").textContent = "сохранено";
    }

    function renderHabitStats(items) {
      $("#habit-stats").innerHTML = items.length ? items.map((item) => `
        <article class="stat-card">
          <div class="stat-top">
            <h2>${escapeHtml(item.name)}</h2>
            <b class="stat-percent">${item.percent}%</b>
          </div>
          <div class="stat-bar"><span class="stat-fill" style="width:${Math.max(0, Math.min(100, item.percent))}%"></span></div>
          <div class="stat-meta">
            <span>срывов ${item.missed_days}</span>
            <span>серия ${item.streak}</span>
            <span>${escapeHtml(item.label)}</span>
          </div>
        </article>
      `).join("") : '<div class="empty">Статистика появится после первых отметок.</div>';
    }

    function habitStatus(habit) {
      if (habit.done_today) return "готово";
      if (habit.missed_today) return "не сегодня";
      return "ждёт";
    }

    function todayActions(habit) {
      if (habit.done_today) {
        return `
          <button class="done" type="button" disabled>Выполнено</button>
          <button class="ghost" data-action="undo" data-id="${habit.id}" type="button">Отменить</button>
        `;
      }
      if (habit.missed_today) {
        return `
          <button class="skipped" type="button" disabled>Не сегодня</button>
          <button class="primary" data-action="mark" data-id="${habit.id}" type="button">Выполнить</button>
          <button class="ghost" data-action="undo" data-id="${habit.id}" type="button">Вернуть</button>
        `;
      }
      return `
        <button class="primary" data-action="mark" data-id="${habit.id}" type="button">Выполнил</button>
        <button class="ghost" data-action="miss" data-id="${habit.id}" type="button">Не сегодня</button>
      `;
    }

    function todayCard(habit, extraClass = "today-card") {
      return `
        <article class="panel ${extraClass}">
          ${habit.is_primary ? '<span class="badge">главная</span>' : ""}
          <div>
            <h2>${escapeHtml(habit.name)}</h2>
            <p class="muted">${escapeHtml(habit.goal_text)} · серия ${habit.streak} · ${habitStatus(habit)}</p>
          </div>
          <div class="actions">
            ${todayActions(habit)}
          </div>
        </article>
      `;
    }

    function renderToday(data) {
      const habits = data.habits || [];
      const primary = habits.find((habit) => habit.is_primary);
      const rest = primary ? habits.filter((habit) => habit.id !== primary.id) : habits;
      $("#summary").textContent = "Сегодня";
      $("#primary-today").innerHTML = primary ? todayCard(primary, "primary-card") : "";
      $("#today-list").innerHTML = rest.length
        ? rest.map((habit) => todayCard(habit)).join("")
        : habits.length ? "" : '<div class="empty">Привычек пока нет. Начни с одной маленькой.</div>';
    }

    function goalValue(habit) {
      if (habit.goal_type === "weekly") return `weekly_${habit.goal_value || 3}`;
      return habit.goal_type || "daily";
    }

    function goalOptions(selected) {
      return [
        ["daily", "Каждый день"],
        ["weekdays", "По будням"],
        ["weekly_3", "3 раза в неделю"],
        ["weekly_5", "5 раз в неделю"],
      ].map(([value, label]) => `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`).join("");
    }

    function goalPayload(value) {
      if (value.startsWith("weekly_")) return { goal_type: "weekly", goal_value: Number(value.slice(7)) };
      return { goal_type: value };
    }

    function primaryTime(habit) {
      return habit.primary_time || habit.reminder?.reminder_time || "09:00";
    }

    function renderManage(data) {
      const habits = data.habits || [];
      $("#habit-list").innerHTML = habits.length ? habits.map((habit) => `
        <article class="panel habit-card ${habit.is_primary ? "primary-card" : ""}" data-id="${habit.id}">
          <div class="habit-row">
            <button class="drag-handle" data-action="drag" data-id="${habit.id}" type="button" aria-label="Переместить">☰</button>
            <div class="habit-title">
              <h2>${escapeHtml(habit.name)}</h2>
              <p class="muted">${escapeHtml(habit.goal_text)} · всего отметок ${habit.total_completed}</p>
            </div>
          </div>
          <div class="habit-actions">
            <button class="ghost" data-action="rename" data-id="${habit.id}" data-name="${escapeHtml(habit.name)}" type="button">Название</button>
            <button class="danger" data-action="delete" data-id="${habit.id}" type="button">Удалить</button>
          </div>
          <div class="settings">
            <select data-action="goal" data-id="${habit.id}">${goalOptions(goalValue(habit))}</select>
            <form class="reminder-form" data-id="${habit.id}">
              <input name="reminder" type="time" value="${escapeHtml(habit.is_primary ? primaryTime(habit) : habit.reminder?.reminder_time || "")}" aria-label="Напоминание">
              <button type="submit">OK</button>
            </form>
            ${habit.reminder?.enabled ? `<button class="ghost" data-action="reminder-off" data-id="${habit.id}" type="button">Отключить напоминание</button>` : ""}
          </div>
        </article>
      `).join("") : '<div class="empty">Список пуст.</div>';
    }

    function renderSleep(items) {
      const filled = items.filter((item) => Number(item.hours) > 0);
      const avgHours = filled.length ? (filled.reduce((sum, item) => sum + Number(item.hours || 0), 0) / filled.length).toFixed(1) : "-";
      const avgRate = filled.length ? (filled.reduce((sum, item) => sum + Number(item.rate || 0), 0) / filled.length).toFixed(1) : "-";
      $("#sleep-avg").textContent = avgHours === "-" ? "-" : `${avgHours} ч`;
      $("#sleep-quality").textContent = avgRate === "-" ? "-" : `${avgRate}/5`;

      const width = 700;
      const height = 292;
      const left = 42;
      const right = 18;
      const top = 34;
      const bottom = 66;
      const plotWidth = width - left - right;
      const plotHeight = height - top - bottom;
      const x = (index) => left + (items.length < 2 ? plotWidth / 2 : index * plotWidth / (items.length - 1));
      const yRate = (rate) => top + (5 - Math.max(0, Math.min(5, rate))) * plotHeight / 5;
      const linePoints = items.map((item, index) => `${x(index)},${yRate(Number(item.rate) || 0)}`).join(" ");
      const rows = Array.from({ length: 6 }, (_, value) => {
        const y = yRate(value);
        return `<line class="grid-line" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>
          <text class="chart-label" x="${left - 12}" y="${y + 5}" text-anchor="end">${value}</text>`;
      }).reverse().join("");
      const columns = items.map((item, index) => {
        const px = x(index);
        const hours = Math.max(0, Math.min(12, Number(item.hours) || 0));
        const barHeight = hours / 12 * plotHeight;
        return `<line class="grid-line" x1="${px}" y1="${top}" x2="${px}" y2="${height - bottom}"></line>
          <rect class="sleep-bar-svg" x="${px - 11}" y="${height - bottom - barHeight}" width="22" height="${barHeight}" rx="4"></rect>
          <text class="chart-label" x="${px}" y="${height - 20}" text-anchor="end" transform="rotate(-50 ${px} ${height - 20})">${escapeHtml(item.date)}</text>`;
      }).join("");
      const dots = items.map((item, index) => {
        const rate = Number(item.rate) || 0;
        return `<circle class="quality-dot" cx="${x(index)}" cy="${yRate(rate)}" r="5"></circle>`;
      }).join("");

      $("#sleep-chart").innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Качество сна за 7 дней">
          <rect x="0" y="0" width="${width}" height="${height}" fill="#f7f7f4"></rect>
          <rect x="282" y="12" width="62" height="24" fill="#008000"></rect>
          <text class="chart-title" x="354" y="30">Качество сна</text>
          ${rows}
          ${columns}
          <line class="axis-line" x1="${left}" y1="${top}" x2="${left}" y2="${height - bottom}"></line>
          <line class="axis-line" x1="${left}" y1="${height - bottom}" x2="${width - right}" y2="${height - bottom}"></line>
          <polyline class="quality-line" points="${linePoints}"></polyline>
          ${dots}
        </svg>
      `;
      const today = items.at(-1);
      if (today?.sleep_out) $("#sleep-out").value = today.sleep_out;
      if (today?.sleep_up) $("#sleep-up").value = today.sleep_up;
      $("#sleep-rate").querySelectorAll("button").forEach((button) => {
        button.classList.toggle("selected", Number(button.dataset.rate) === Number(today?.rate || 0));
      });
    }

    async function updateAfter(action) {
      state.data = await action();
      render();
    }

    function orderedHabitIds() {
      return [...$("#habit-list").querySelectorAll(".habit-card")].map((item) => Number(item.dataset.id));
    }

    async function saveOrder() {
      const habitIds = orderedHabitIds();
      state.data = await request("/api/habits/reorder", { habit_ids: habitIds });
      if (habitIds.length) state.data = await request(`/api/habits/${habitIds[0]}/primary`);
      render();
      showToast("Порядок и главная сохранены");
    }

    function nearestCard(y) {
      const cards = [...$("#habit-list").querySelectorAll(".habit-card:not(.dragging)")];
      return cards.reduce((closest, card) => {
        const box = card.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        return offset < 0 && offset > closest.offset ? { offset, card } : closest;
      }, { offset: Number.NEGATIVE_INFINITY, card: null }).card;
    }

    function startDrag(event) {
      const handle = event.target.closest('[data-action="drag"]');
      if (!handle) return;
      const card = handle.closest(".habit-card");
      state.draggingId = Number(card.dataset.id);
      card.classList.add("dragging");
      handle.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function moveDrag(event) {
      if (!state.draggingId) return;
      const list = $("#habit-list");
      const dragged = list.querySelector(`.habit-card[data-id="${state.draggingId}"]`);
      const before = nearestCard(event.clientY);
      if (before) list.insertBefore(dragged, before);
      else list.appendChild(dragged);
    }

    async function endDrag() {
      if (!state.draggingId) return;
      $("#habit-list").querySelector(".habit-card.dragging")?.classList.remove("dragging");
      state.draggingId = null;
      try {
        await saveOrder();
      } catch (error) {
        showToast(error.message || "Не удалось сохранить порядок");
        refresh();
      }
    }

    async function runTodayAction(button) {
      const { action, id } = button.dataset;
      button.disabled = true;
      button.textContent = "Сохраняю";
      try {
        await updateAfter(() => request(`/api/habits/${id}/${action}`));
      } catch (error) {
        showToast(error.message || "Не удалось обновить");
        refresh();
      }
    }

    $("#tab-today").addEventListener("click", () => setTab("today"));
    $("#tab-sleep").addEventListener("click", () => setTab("sleep"));
    $("#tab-manage").addEventListener("click", () => setTab("manage"));
    $("#quick-add").addEventListener("click", () => setTab("manage"));
    $("#daily-note").addEventListener("input", () => {
      $("#note-status").textContent = "пишу";
      clearTimeout(state.noteTimer);
      state.noteTimer = setTimeout(async () => {
        try {
          state.data = await request("/api/note/today", { note: $("#daily-note").value });
          $("#note-status").textContent = "сохранено";
        } catch {
          $("#note-status").textContent = "не сохранено";
        }
      }, 650);
    });
    window.addEventListener("focus", refresh);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refresh();
    });
    setInterval(() => {
      if (!document.hidden && state.tab === "today") refresh();
    }, 15000);

    $("#add-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = $("#habit-name");
      const name = input.value.trim();
      if (!name) return;
      input.value = "";
      await updateAfter(() => request("/api/habits", { name }));
    });

    $("#today-list").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      await runTodayAction(button);
    });
    $("#primary-today").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      await runTodayAction(button);
    });

    $("#habit-list").addEventListener("pointerdown", startDrag);
    $("#habit-list").addEventListener("pointermove", moveDrag);
    $("#habit-list").addEventListener("pointerup", endDrag);
    $("#habit-list").addEventListener("pointercancel", endDrag);
    $("#habit-list").addEventListener("change", async (event) => {
      const select = event.target.closest('select[data-action="goal"]');
      if (!select) return;
      await updateAfter(() => request(`/api/habits/${select.dataset.id}/goal`, goalPayload(select.value)));
    });

    $("#habit-list").addEventListener("submit", async (event) => {
      const form = event.target.closest(".reminder-form");
      if (!form) return;
      event.preventDefault();
      const reminder = form.elements.reminder.value.trim();
      if (!reminder) return;
      await updateAfter(() => request(`/api/habits/${form.dataset.id}/reminder`, { reminder_time: reminder }));
    });

    $("#habit-list").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button || button.dataset.action === "drag") return;
      const { action, id, name } = button.dataset;
      if (action === "rename") {
        state.rename = id;
        $("#rename-input").value = name || "";
        $("#rename-modal").classList.remove("hidden");
        setTimeout(() => $("#rename-input").focus(), 0);
        return;
      }
      if (action === "delete" && !confirm("Удалить привычку?")) return;
      if (action === "delete") await updateAfter(() => request(`/api/habits/${id}/delete`));
      if (action === "reminder-off") await updateAfter(() => request(`/api/habits/${id}/reminder/off`));
    });

    $("#sleep-rate").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-rate]");
      if (!button) return;
      state.sleep = await request("/api/sleep/today", {
        sleep_out: $("#sleep-out").value,
        sleep_up: $("#sleep-up").value,
        rate: Number(button.dataset.rate),
      });
      renderSleep(state.sleep.items || []);
      showToast("Сон сохранён");
    });

    $("#rename-cancel").addEventListener("click", () => $("#rename-modal").classList.add("hidden"));
    $("#rename-save").addEventListener("click", async () => {
      const name = $("#rename-input").value.trim();
      if (!state.rename || !name) return;
      await updateAfter(() => request(`/api/habits/${state.rename}/rename`, { name }));
      state.rename = null;
      $("#rename-modal").classList.add("hidden");
    });

    refresh();
  </script>
</body>
</html>
